name: Trivy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan dependencies and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan filesystems
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/work"
          -w /work
          aquasec/trivy:0.76.2
          fs --scanners vuln,misconfig
          --severity HIGH,CRITICAL
          --exit-code 1
          .