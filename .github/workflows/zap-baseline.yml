name: OWASP ZAP Baseline

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional URL to scan (uses the ZAP_TARGET_URL repository variable when empty)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: zap-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan deployed web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate target URL
        env:
          ZAP_TARGET_URL: ${{ inputs.target_url || secrets.ZAP_TARGET_URL }}
        run: |
          if [ -z "$ZAP_TARGET_URL" ]; then
            echo "Set the repository variable ZAP_TARGET_URL or provide target_url when starting this workflow."
            exit 1
          fi
          case "$ZAP_TARGET_URL" in
            https://*|http://*) ;;
            *) echo "ZAP target must start with http:// or https://"; exit 1 ;;
          esac

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target_url || secrets.ZAP_TARGET_URL }}
          allow_issue_writing: false
          fail_action: false
